<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <section id="place-details" class="place-details">
            <!-- Place details will be populated dynamically -->
            <h2>Cozy Studio</h2>
            <div class="place-info">
                <p>Host: Jane Doe</p>
                <p>Price per night: $50</p>
                <p>Description: A cozy studio in the heart of the city.</p>
                <p>Amenities:</p>
                <p><img src="images/icon_bed.png" alt="Bed icon">Bed</p>
                <p><img src="images/icon_wifi.png" alt="Wifi icon">Wifi</p>
                <p><img src="images/icon_bath.png" alt="Bath icon">Bath</p>
            </div>
        </section>
        <section id="reviews">
            <!-- Reviews will be populated dynamically -->
            <article class="review-card">
                <p>Great place to stay!</p>
                <p>John Smith</p>
                <p>Rating: 5</p>
            </article>
        </section>
        <a href="add_review.html" class="details-button">Add Review</a>
    </main>
    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
